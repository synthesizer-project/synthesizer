# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Synthesizer

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          sudo apt install pandoc
          # Install loader dependencies (doing this separately because bigfile
          # is not set up properly and depends on numpy and cython, the former
          # we depend on, the latter we need to install)
          pip install cython
          WITH_OPENMP=1 ATOMIC_TIMING=1 pip install .[test,docs,bluetides,eagle]
          # These optional dependencies are needed for the docs and test but 
          # neither are on PyPI so must be installed separately
          pip install "illustris_python @ git+https://github.com/illustristng/illustris_python.git@master"
          pip install "git+https://github.com/WillJRoper/dense_basis.git"
          pip install pytest-xdist  # enable parallel pytest execution
          # Output the compilation report so it can be viewed in an action log
          cat build_synth.log
      - uses: astral-sh/ruff-action@v3 # Lint with Ruff
        with:
          version: 0.15.15
          args: "format --check --diff"
      - name: Check C++ formatting with clang-format
        run: |
          pip install "clang-format==22.1.4"
          ./format_extensions.sh --check
        shell: bash
      - name: Download test data
        run: |
          # Download the data we need
          synthesizer-download --test-grids --dust-grid --all-sim-data --instruments EuclidNISP
      - name: Download SVO filter cache
        run: |
          synthesizer-download --svo-filter-cache
      - name: Test with pytest
        run: |
          pytest -n auto
          # Test ipython notebooks
          pytest -n auto --nbmake docs/source/*/*.ipynb docs/source/*/*/*.ipynb
      - name: Test syncretize
        run: |
          git clone https://github.com/synthesizer-project/syncretize.git
          cd syncretize
          pip install .
          pytest -n auto
      - name: Sphinx Build
        run: |
          # Test sphinx build (runs all notebooks)
          cd docs
          make clean
          make html SPHINXOPTS="-j auto"

  free-threaded:
    # Test on a free-threaded (no-GIL) build of Python, where emission models
    # can be executed concurrently with nr_model_threads.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.14t
        uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          WITH_OPENMP=1 pip install .[test]
          pip install pytest-xdist  # enable parallel pytest execution
          cat build_synth.log
      - name: Download test data
        run: |
          synthesizer-download --test-grids --dust-grid --all-sim-data --instruments EuclidNISP
      - name: Download SVO filter cache
        run: |
          synthesizer-download --svo-filter-cache
      - name: Test with pytest
        # NOTE: astropy currently re-enables the GIL on import, so disable it
        # explicitly to exercise the threaded execution paths.
        env:
          PYTHON_GIL: "0"
        run: |
          python -c "import sys, synthesizer; assert not sys._is_gil_enabled()"
          pytest -n auto
